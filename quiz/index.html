<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#FFF9ED"><script src="theme.js"></script><title>AWS 문제 연습 · 1bit</title><link rel="stylesheet" href="../site.css"><link rel="stylesheet" href="quiz.css?v=auto-review"><script src="engine.js?v=auto-review" defer></script><script src="account.js?v=review-safety" defer></script><script src="quiz.js?v=auto-review" defer></script></head>
<body><a class="skip-link" href="#main">문제로 건너뛰기</a><main id="main"><div class="theme-tools" role="group" aria-label="퀴즈 테마"><button type="button" data-quiz-theme-choice="light" aria-pressed="true">일반 모드</button><button type="button" data-quiz-theme-choice="dark" aria-pressed="false">다크 모드</button></div><p id="notice" role="status"></p><details id="account-panel" open><summary id="account-summary">로그인 · 계정별 진도 저장</summary><form id="account-form"><fieldset id="account-fields" disabled><label>아이디<input id="account-id" autocomplete="username" required minlength="3" maxlength="64" pattern="[A-Za-z0-9_]+"></label><label>비밀번호<input id="account-password" type="password" autocomplete="current-password" required maxlength="128"></label><div class="tools"><button id="account-submit" type="submit">로그인</button><a class="file-button auth-link" href="signup/">회원가입</a></div></fieldset></form><div id="account-actions" class="tools" hidden><button id="import-guest" type="button">기존 브라우저 진도 가져오기</button><button id="cloud-reload" type="button" hidden>서버 진도 불러오기</button><button id="account-logout" type="button">로그아웃</button></div><p id="account-status" role="status">문제와 로그인 상태를 불러오는 중</p></details><div id="quiz-content" hidden><section id="question" aria-labelledby="number"><form id="form"><div class="question-head"><h1 id="number" tabindex="-1"></h1><span id="auto-review" hidden>자동 복습</span></div><p id="prompt"></p><fieldset><legend class="sr-only">보기</legend><div id="choices"></div></fieldset><div id="result" role="status" hidden></div><button id="mark-wrong" type="button" hidden>찍어서 맞힘 · 오답으로 저장</button><div class="submit-area"><button class="primary" id="submit" type="submit" disabled>정답 확인</button><button class="primary" id="next" type="button" hidden>다음 문제</button></div></form></section><section id="done" hidden><h2>모든 문제를 풀었습니다.</h2><p>남은 오답이 없습니다. 문제 번호를 선택해 다시 풀 수 있습니다.</p></section><div class="review-tools"><button id="review" type="button">복습하기</button><span id="review-status" role="status"></span></div><section id="daily-goal" aria-label="일일 학습 목표"><div class="daily-summary"><strong>일일 학습 목표</strong><span id="daily-count" role="status"></span></div><progress id="daily-progress" aria-label="오늘 학습 진행률" value="0" max="1"></progress><form id="daily-form"><label for="daily-target">하루 목표</label><input id="daily-target" type="number" inputmode="numeric" min="1" max="948" step="1" required aria-describedby="daily-hint"><span>문제</span><button type="submit">저장</button></form><p id="daily-hint" class="hint">한국 시간 매일 00시 초기화 · 같은 문제는 하루 한 번 집계합니다.</p><p id="daily-message" role="status"></p></section><section class="number-section"><span id="number-label">문제 번호 지정</span><details id="number-picker"><summary id="number-current" aria-labelledby="number-label number-current">문제 번호 지정</summary><div id="numbers" aria-label="문제 번호 목록"></div></details></section></div><details id="progress-tools" hidden><summary>진도 백업과 복원</summary><p class="hint">진도는 계정별로 저장됩니다. 기록을 지우기 전에 백업하세요.</p><div class="tools"><button id="backup">진도 백업</button><label class="file-button">백업 불러오기<input id="restore" type="file" accept="application/json,.json"></label><button id="reset">처음부터 시작</button></div></details><noscript>문제를 풀려면 JavaScript를 활성화하세요.</noscript></main></body></html>
