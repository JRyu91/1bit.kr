<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#FFF9ED"><title>회원가입 · AWS 문제 연습</title><link rel="stylesheet" href="../../site.css"><link rel="stylesheet" href="../quiz.css"><script src="../account.js" defer></script><script src="signup.js" defer></script></head>
<body><main><h1 class="auth-title">회원가입</h1><form id="signup-form"><fieldset id="signup-fields" disabled><label>아이디<input id="signup-id" autocomplete="username" required minlength="3" maxlength="64" pattern="[A-Za-z0-9_]+"></label><label>비밀번호<input id="signup-password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></label><label>닉네임<input id="signup-name" autocomplete="nickname" required maxlength="10"></label><div class="tools"><button type="submit">회원가입</button><a class="file-button auth-link" href="../">로그인으로 돌아가기</a></div></fieldset></form><p id="signup-status" role="status">아이디, 비밀번호, 닉네임을 입력하세요. 가입 완료 후 자동으로 로그인됩니다.</p><noscript>회원가입을 하려면 JavaScript를 활성화하세요.</noscript></main></body></html>
