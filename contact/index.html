<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact · 유준형</title>
<meta name="description" content="유준형 이메일, GitHub">
<meta property="og:type" content="website">
<meta property="og:title" content="Contact · 유준형">
<meta property="og:description" content="이메일, GitHub">
<meta property="og:url" content="https://jryu91.github.io/1bit.kr/contact/">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 메인(index.html)과 같은 Botanical Cream 토큰. sage 는 글자 대비가 2.3:1 이라 면·선에만 쓴다 */
:root{
  --cream:#FFF9ED; --green:#355E3B; --green-deep:#2B4D30; --sage:#A2AD84; --beige:#D9C7A3; --ink:#26382B; --surface:#FFFFFF;
  --muted:#5B6A5E; --line:#E6DCC8; --line-strong:#C9C3A6; --sage-tint:#ECEDE2;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px; --s12:48px; --s14:56px; --s16:64px;
  --radius:6px;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  /* 증명사진 크기·비율 */
  --id-w:200px; --id-ratio:3/4; --id-pos:50% 30%; --id-fit:cover;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:400 16px/1.7 var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 var(--s10)}

/* ── 상단바 ── */
.bar{border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);min-height:64px}
.home{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;font-weight:600;text-decoration:none}
.home svg{width:16px;height:16px;color:var(--green)}
.menu{display:flex;gap:var(--s1);margin:0;padding:0;list-style:none}
.menu a{white-space:nowrap;display:inline-flex;align-items:center;min-height:44px;padding:0 var(--s3);border-radius:var(--radius);font-size:15px;color:var(--muted);text-decoration:none;transition:color .2s ease,background-color .2s ease}
.menu a:hover{color:var(--ink);background:var(--surface)}
.menu a[aria-current="page"]{color:var(--green);font-weight:600;box-shadow:inset 0 -2px 0 var(--green);border-radius:0}

/* ── 헤더 ── */
.intro{display:grid;grid-template-columns:var(--id-w) minmax(0,1fr);gap:var(--s12);align-items:end;padding:var(--s14) 0 var(--s12)}
.id{position:relative;aspect-ratio:var(--id-ratio);border-radius:var(--radius);overflow:hidden;background:var(--sage-tint)}
.id img{position:absolute;inset:0;width:100%;height:100%;object-fit:var(--id-fit);object-position:var(--id-pos)}
.id-empty{position:absolute;inset:0;display:none;place-items:center;font-size:48px;font-weight:300;letter-spacing:-.04em;color:var(--sage)}
.id.is-empty .id-empty{display:grid}
.id.is-empty img{display:none}
.role{margin:0;font-size:13px;line-height:1.4;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
h1{margin:var(--s3) 0 0;font-size:clamp(36px,4vw,48px);line-height:1.12;font-weight:600;letter-spacing:-.025em}
h1 .en{display:block;margin-top:var(--s2);font-size:18px;line-height:1.4;font-weight:400;letter-spacing:0;color:var(--muted)}
.lead{max-width:34em;margin:var(--s5) 0 0;font-size:17px;line-height:1.75;color:var(--muted)}

/* ── 섹션: 왼쪽 제목 칸 + 오른쪽 내용 ── */
section{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--s12);padding:var(--s12) 0;border-top:1px solid var(--line)}
section > h2{margin:0;font-size:13px;line-height:1.6;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
section > h2 span{display:block;font-weight:500;color:var(--muted);letter-spacing:.04em}
.note{margin:0 0 var(--s5);font-size:14px;color:var(--muted)}
.note.focus-text{font-size:15px;color:var(--ink)}

/* 경력 */
.company{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:var(--s2) var(--s6)}
.company h3{margin:0;font-size:22px;line-height:1.35;font-weight:600;letter-spacing:-.01em}
.company .period{font-size:15px;font-weight:500;color:var(--green);white-space:nowrap}
.position{margin:var(--s1) 0 0;font-size:15px;color:var(--muted)}
.duties{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s6) var(--s10);margin:var(--s8) 0 0;padding:var(--s8) 0 0;border-top:1px dashed var(--line);list-style:none;counter-reset:duty}
.duties li{counter-increment:duty;display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:var(--s2)}
.duties li::before{content:counter(duty,decimal-leading-zero);grid-row:1/3;font-size:13px;line-height:1.6;font-weight:600;color:var(--sage);font-variant-numeric:tabular-nums}
.duties h4{margin:0;font-size:16px;line-height:1.5;font-weight:600}
.duties p{margin:var(--s1) 0 0;font-size:15px;line-height:1.65;color:var(--muted)}

/* 기술·학력·자격: 정의 목록 행 */
.rows{margin:0}
.rows > div{display:grid;grid-template-columns:240px minmax(0,1fr);gap:var(--s2) var(--s6);padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.rows > div:first-child{padding-top:0}
.rows > div:last-child{border-bottom:0;padding-bottom:0}
.rows dt{font-size:15px;font-weight:600}
.rows dd{margin:0;font-size:15px;color:var(--muted)}
.rows dd strong{color:var(--ink);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:var(--s2);margin:0;padding:0;list-style:none}
.tags li{padding:2px var(--s3);border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:14px;line-height:1.6;color:var(--ink)}
.status{display:inline-block;margin-left:var(--s2);font-size:13px;font-weight:500;color:var(--green)}
.status.pending{color:var(--muted)}

footer{border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;padding-top:var(--s5);padding-bottom:var(--s10);font-size:13px;color:var(--muted)}
footer a{text-decoration:none}
footer a:hover{color:var(--ink)}

@media (max-width:900px){
  section{grid-template-columns:1fr;gap:var(--s5)}
  .rows > div{grid-template-columns:200px minmax(0,1fr)}
}
@media (max-width:600px){
  :root{--id-w:88px}
  .wrap{padding:0 var(--s5)}
  .bar .wrap{flex-wrap:wrap;gap:0;padding-top:var(--s2);padding-bottom:var(--s2)}
  .menu{width:100%;justify-content:space-between}
  .menu a{padding:0 var(--s2);font-size:14px}
  .intro{grid-template-columns:var(--id-w) minmax(0,1fr);gap:var(--s5);align-items:center;padding:var(--s8) 0}
  .intro .lead{grid-column:1/-1;margin-top:0}
  .intro .head-text{display:contents}
  .id-empty{font-size:28px}
  h1{font-size:32px;margin-top:var(--s2)}
  h1 .en{font-size:16px;margin-top:var(--s1)}
  .role{font-size:12px;letter-spacing:.08em}
  section{padding:var(--s10) 0}
  .company h3{font-size:20px}
  .duties{grid-template-columns:1fr;gap:var(--s5)}
  .rows > div{grid-template-columns:1fr;gap:var(--s2)}
}
@media (max-width:380px){.role .sep{display:block;height:0;overflow:hidden}}
@media (prefers-reduced-motion:reduce){.menu a{transition:none}}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="home" href="../"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>유준형</a>
    <nav aria-label="주요 메뉴">
      <ul class="menu">
        <li><a href="../profile/">Profile</a></li>
        <li><a href="../portfolio/">Portfolio</a></li>
        <li><a href="/game/">Playground</a></li>
        <li><a href="./" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="head-text" style="padding:var(--s14) 0 var(--s12)">
    <div>
      <p class="role">Contact</p>
      <h1>연락처<span class="en">이메일, GitHub</span></h1>
    </div>
    <p class="lead">준비 중입니다.</p>
  </div>
</main>

<footer>
  <div class="wrap"><span>© 2026 유준형</span><a href="../">← Home</a></div>
</footer>
</body>
</html>
