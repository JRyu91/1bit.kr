<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>유준형 · 클라우드 인프라 엔지니어</title>
<meta name="description" content="클라우드 인프라·DevOps 엔지니어 유준형의 포트폴리오">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Botanical Cream 토큰. sage 는 글자 대비가 2.3:1 이라 면·선에만 쓴다 */
:root{
  --cream:#FFF9ED; --green:#355E3B; --green-deep:#2B4D30; --sage:#A2AD84; --beige:#D9C7A3; --ink:#26382B; --surface:#FFFFFF;
  --muted:#5B6A5E;        /* 보조 텍스트: cream 5.5 / white 5.7 */
  --on-green-sub:#D5DDCB; /* 그린 위 보조 텍스트 5.3 */
  --line:#E6DCC8;         /* 기본 테두리 */
  --line-strong:#C9C3A6;  /* hover 테두리(sage 를 옅게) */
  --sage-tint:#ECEDE2;    /* active 배경, 미디어 바탕 */

  /* 간격: 4px 기반 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px; --s12:48px; --s14:56px;

  /* 글자 스케일: 크기 / 행간 / 자간 / 굵기를 한 묶음으로 */
  --t-display:clamp(40px,4.2vw,56px); --t-display-lh:1.12; --t-display-ls:-.025em; --t-display-w:600;
  --t-lead:17px;    --t-lead-lh:1.75;
  --t-label:14px;   --t-label-lh:1.4;
  --t-title:18px;   --t-title-lh:1.35;  --t-title-ls:-.01em;
  --t-caption:14px; --t-caption-lh:1.5;

  --radius:6px;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:400 var(--t-lead)/var(--t-lead-lh) var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}

.page{max-width:1140px;min-height:100dvh;margin:0 auto;padding:var(--s14) var(--s10);display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);align-content:center;column-gap:64px;row-gap:var(--s14);align-items:center}

/* ── 미디어: 비율 고정 칸이라 사진/GIF/영상 로딩·재생 중에도 레이아웃이 안 흔들린다 ── */
.media{position:relative;margin:0;aspect-ratio:var(--media-ratio,4/5);border-radius:var(--radius);overflow:hidden;background:var(--sage-tint)}
.media img,.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:var(--media-fit,cover);object-position:var(--media-pos,50% 30%)}
.media-empty{position:absolute;inset:0;display:none;place-items:center;font-size:clamp(56px,7vw,88px);font-weight:300;letter-spacing:-.04em;color:var(--sage)}
.media.is-empty .media-empty{display:grid}
.media.is-empty picture,.media.is-empty video{display:none}

/* ── 소개 ── */
.role{margin:0;font-size:13px;line-height:var(--t-label-lh);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--green)} /* 대문자는 CSS 로만, 스크린리더는 원문을 읽는다 */
h1{margin:var(--s3) 0 0;font-size:var(--t-display);line-height:var(--t-display-lh);font-weight:var(--t-display-w);letter-spacing:var(--t-display-ls)}
h1 .en{display:block;margin-top:var(--s2);font-size:18px;line-height:1.4;font-weight:400;letter-spacing:0;color:var(--muted)}
.intro{max-width:31em;margin:var(--s6) 0 0;color:var(--muted)}

/* ── 버튼형 내비게이션: 칸 전체가 링크. Portfolio 만 채움 ── */
nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3);margin-top:var(--s10)}
nav a{display:grid;grid-template-columns:1fr auto;align-items:center;align-content:start;column-gap:var(--s3);row-gap:var(--s1);padding:var(--s4) var(--s5);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);text-decoration:none;transition:background-color .2s ease,border-color .2s ease}
nav a:hover{background:var(--surface);border-color:var(--line-strong)}
nav a:active{background:var(--sage-tint)}
nav b{font-size:var(--t-title);line-height:var(--t-title-lh);letter-spacing:var(--t-title-ls);font-weight:600}
nav small{grid-column:1/-1;font-size:var(--t-caption);line-height:var(--t-caption-lh);color:var(--muted)}
nav svg{width:16px;height:16px;color:var(--green);transition:transform .2s ease}
nav a:hover svg{transform:translate(2px,-2px)}
nav .live{margin-left:var(--s2);font-size:13px;font-weight:500;letter-spacing:0;color:var(--green)}
nav a.primary{background:var(--green);border-color:var(--green);color:var(--cream)}
nav a.primary small{color:var(--on-green-sub)}
nav a.primary svg{color:var(--cream)}
nav a.primary:hover{background:var(--green-deep);border-color:var(--green-deep)}
nav a.primary:active{background:var(--ink)}

footer{grid-column:1/-1;display:flex;justify-content:space-between;padding-top:var(--s5);border-top:1px solid var(--line);font-size:13px;line-height:1.5;color:var(--muted)}

/* 태블릿: 사진을 이름 옆에 작게, 소개·메뉴는 전체 폭 */
@media (max-width:900px){
  .page{grid-template-columns:168px minmax(0,1fr);column-gap:var(--s8);row-gap:var(--s8);padding:var(--s10) var(--s8);align-content:start}
  .intro-col{display:contents}
  .media{grid-row:1}
  .head{grid-row:1;align-self:end}
  .rest{grid-column:1/-1}
  .intro{margin-top:0}
  nav{margin-top:var(--s8)}
}
/* 모바일: 같은 구조를 압축, 메뉴는 한 줄씩 */
@media (max-width:600px){
  :root{--t-display:32px; --t-lead:16px; --t-title:17px}
  .page{grid-template-columns:88px minmax(0,1fr);column-gap:var(--s5);row-gap:var(--s6);padding:var(--s8) var(--s5) var(--s6)}
  .media{--media-ratio:1/1}
  .media-empty{font-size:32px}
  h1{margin-top:var(--s2)}
  h1 .en{margin-top:var(--s1);font-size:16px}
  .role{font-size:12px;letter-spacing:.08em}
  nav{grid-template-columns:1fr;gap:var(--s2);margin-top:var(--s6)}
  nav a{padding:var(--s4)}
}
/* 360px 대: 한 줄에 안 들어가 '·' 앞에서 어색하게 끊기므로 두 줄로 정리 */
@media (max-width:380px){.role .sep{display:block;height:0;overflow:hidden}}
@media (prefers-reduced-motion:reduce){nav a,nav svg{transition:none}}
</style>
</head>
<body>
<div class="page">
  <!--
    프로필 미디어 교체법 (assets/ 폴더):
    - 사진: assets/photo.jpg (png/webp 면 img src 만 바꾼다)
    - GIF: assets/photo.gif 를 넣고 아래 <source> 주석을 푼다. 모션 줄이기 사용자에겐 photo.jpg 가 나온다
    - 영상: <picture> 를 지우고 <video> 주석을 푼다. poster 는 첫 프레임 이미지
    - 비율·크롭: figure 의 style 에 --media-ratio:4/5; --media-pos:50% 30%; --media-fit:cover
    - 파일이 없거나 깨지면 JR 모노그램이 나온다
  -->
  <figure class="media" id="media">
    <picture>
      <!-- <source srcset="assets/photo.gif" type="image/gif" media="(prefers-reduced-motion: no-preference)"> -->
      <img src="assets/photo.jpg" alt="유준형 프로필 사진" width="800" height="1000" decoding="async" onerror="this.closest('.media').classList.add('is-empty')">
    </picture>
    <!-- <video src="assets/intro.mp4" poster="assets/photo.jpg" autoplay muted loop playsinline aria-label="유준형 소개 영상"></video> -->
    <div class="media-empty" aria-hidden="true">JR</div>
  </figure>

  <div class="intro-col">
    <div class="head">
      <p class="role">Cloud Infrastructure<span class="sep"> · </span>DevOps</p>
      <h1>유준형<span class="en">Jason Ryu</span></h1>
    </div>
    <div class="rest">
      <p class="intro">9년간 통신 인프라 현장에서 쌓은 경험을 바탕으로, 클라우드 인프라 설계와 자동화로 기술 영역을 확장하고 있습니다.</p>

      <nav aria-label="주요 메뉴">
        <a href="profile/"><b>Profile</b><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4.5 11.5l7-7M5.5 4.5h6v6"/></svg><small>경력, 학력, 자격, 기술 스택</small></a>
        <a href="portfolio/" class="primary"><b>Portfolio</b><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4.5 11.5l7-7M5.5 4.5h6v6"/></svg><small>프로젝트별 설계와 발표 자료</small></a>
        <a href="/game/"><b>Playground<span class="live">운영 중</span></b><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4.5 11.5l7-7M5.5 4.5h6v6"/></svg><small>웹게임 「시간 낭비의 숲」, GKE 운영</small></a>
        <a href="contact/"><b>Contact</b><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4.5 11.5l7-7M5.5 4.5h6v6"/></svg><small>이메일, GitHub</small></a>
      </nav>
    </div>
  </div>

  <footer><span>© 2026 유준형</span><span>1bit.kr</span></footer>
</div>
<script>
  // 영상은 모션 줄이기면 멈춘 첫 프레임만. 이미지가 깨진 채 캐시돼 onerror 를 놓친 경우도 모노그램으로
  const media = document.getElementById('media');
  const video = media.querySelector('video');
  if (video && matchMedia('(prefers-reduced-motion: reduce)').matches) { video.removeAttribute('autoplay'); video.pause(); }
  if (video) video.addEventListener('error', () => media.classList.add('is-empty'));
  const img = media.querySelector('img');
  if (!video && img && img.complete && !img.naturalWidth) media.classList.add('is-empty');
</script>
</body>
</html>
