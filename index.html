<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>유준형 · 클라우드 인프라 엔지니어</title>
<meta name="description" content="클라우드 인프라·DevOps 엔지니어 유준형의 포트폴리오">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Botanical Cream 토큰. sage 는 글자 대비가 2.3:1 이라 면·선에만 쓴다 */
:root{
  --cream:#FFF9ED; --green:#355E3B; --green-deep:#2B4D30; --sage:#A2AD84; --beige:#D9C7A3; --ink:#26382B; --surface:#FFFFFF;
  --muted:#5B6A5E;        /* 보조 텍스트: cream 5.5 / white 5.7 */
  --on-green-sub:#D5DDCB; /* 그린 위 보조 텍스트 5.3 */
  --line:#E8DCC4;         /* beige 를 cream 쪽으로 옅게 */
  --sage-tint:#E9EBDD;    /* active 배경 */
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:40px; --s6:48px; --s8:64px; --s9:72px;
  --radius:8px;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.7 var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}

.page{max-width:1200px;min-height:100dvh;margin:0 auto;padding:var(--s6) var(--s5);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-template-rows:1fr auto;gap:var(--s9);align-items:center}

/* ── 미디어: 4:5 고정 칸이라 사진/GIF/영상이 늦게 와도 레이아웃이 안 흔들린다 ── */
.media{margin:0;padding:var(--s2);border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.media-box{position:relative;aspect-ratio:var(--media-ratio,4/5);border-radius:4px;overflow:hidden;background:var(--sage-tint)}
.media-box img,.media-box video{position:absolute;inset:0;width:100%;height:100%;object-fit:var(--media-fit,cover);object-position:var(--media-pos,50% 30%)}
.media-empty{position:absolute;inset:0;display:none;place-content:center;justify-items:center;gap:var(--s1);color:var(--green)}
.media-empty b{font-size:clamp(48px,7vw,80px);font-weight:700;letter-spacing:-.04em;line-height:1}
.media-empty span{font-size:14px;color:var(--muted)}
.media.is-empty .media-empty{display:grid}
.media.is-empty img,.media.is-empty video,.media.is-empty picture{display:none}
.media figcaption{display:flex;justify-content:space-between;margin-top:var(--s2);font-size:14px;color:var(--muted)}

/* ── 소개 ── */
.role{display:flex;align-items:center;gap:var(--s1);margin:0;font-size:16px;font-weight:600;color:var(--green)}
.role::before{content:"";width:24px;height:2px;background:var(--sage)}
h1{margin:var(--s2) 0 0;font-size:clamp(44px,5.6vw,72px);line-height:1.05;font-weight:700;letter-spacing:-.035em}
.en{margin:var(--s1) 0 0;font-size:20px;font-weight:500;color:var(--muted)}
.intro{max-width:30em;margin:var(--s4) 0 0;font-size:18px;color:var(--muted)}
.intro strong{color:var(--ink);font-weight:600}

/* ── 버튼형 내비게이션: 칸 전체가 링크. Portfolio 만 채움, 나머지는 아웃라인 ── */
nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2);margin-top:var(--s6)}
nav a{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:var(--s3);min-height:132px;padding:var(--s3);border:1px solid var(--line);border-radius:var(--radius);background:var(--cream);color:var(--ink);text-decoration:none;transition:background-color .2s ease,border-color .2s ease}
nav a:hover{background:var(--surface);border-color:var(--green)}
nav a:active{background:var(--sage-tint)}
nav b{font-size:20px;font-weight:600;line-height:1.3}
nav small{display:block;font-size:15px;line-height:1.5;color:var(--muted)}
nav .arrow{position:absolute;top:var(--s3);right:var(--s3);width:20px;height:20px;color:var(--green);transition:transform .2s ease}
nav a:hover .arrow{transform:translate(2px,-2px)}
nav .badge{display:inline-flex;align-items:center;gap:6px;margin-left:var(--s1);font-size:13px;font-weight:500;color:var(--green);vertical-align:2px}
nav .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}
nav a.primary{background:var(--green);border-color:var(--green);color:var(--cream)}
nav a.primary small{color:var(--on-green-sub)}
nav a.primary .arrow{color:var(--cream)}
nav a.primary:hover{background:var(--green-deep);border-color:var(--green-deep)}
nav a.primary:active{background:var(--ink)}

footer{grid-column:1/-1;display:flex;justify-content:space-between;padding-top:var(--s3);border-top:1px solid var(--line);font-size:14px;color:var(--muted)}

/* 태블릿: 한 단으로 쌓되 사진은 옆에 작게 붙여 첫 화면에 메뉴까지 보이게 */
@media (max-width:960px){
  .page{grid-template-rows:none;grid-template-columns:200px minmax(0,1fr);gap:var(--s5) var(--s4);padding:var(--s5) var(--s4);align-items:start}
  .intro-col{display:contents}
  .media{grid-row:1;padding:var(--s1)}
  .media figcaption{display:none}
  .head{grid-row:1;align-self:end}
  .rest{grid-column:1/-1}
  .intro{margin-top:0}
}
/* 모바일: 사진을 위로, 메뉴는 한 줄씩 */
@media (max-width:600px){
  body{font-size:16px}
  .page{grid-template-columns:96px minmax(0,1fr);gap:var(--s3) var(--s2);padding:var(--s3) var(--s2)}
  .media{padding:4px}
  .media-box{--media-ratio:1/1}
  .media-empty b{font-size:32px}
  .media-empty span{display:none}
  h1{font-size:36px;margin-top:var(--s1)}
  .en{font-size:17px;margin-top:4px}
  .role{font-size:14px}
  .role::before{display:none}
  .intro{font-size:16px}
  nav{grid-template-columns:1fr;gap:var(--s1);margin-top:var(--s4)}
  nav a{min-height:0;padding:var(--s2) var(--s5) var(--s2) var(--s2);gap:4px}
  nav b{font-size:18px}
  nav .arrow{top:50%;right:var(--s2);margin-top:-10px}
  nav a:hover .arrow{transform:translateX(2px)}
}
@media (prefers-reduced-motion:reduce){nav a,nav .arrow{transition:none}}
</style>
</head>
<body>
<div class="page">
  <!--
    프로필 미디어 교체법 (assets/ 폴더):
    - 사진만: assets/photo.jpg (png/webp 면 img src 만 바꾼다)
    - GIF: assets/photo.gif 를 넣고 아래 <source> 주석을 푼다. 모션 줄이기 사용자에겐 photo.jpg 가 대신 나온다
    - 영상: <picture> 를 지우고 <video> 주석을 푼다. poster 는 첫 프레임 이미지
    - 비율·크롭: figure 의 style 에 --media-ratio:4/5; --media-pos:50% 30%; --media-fit:cover
    - 파일이 없거나 깨지면 JR 자리표시가 자동으로 나온다
  -->
  <figure class="media" id="media">
    <div class="media-box">
      <picture>
        <!-- <source srcset="assets/photo.gif" type="image/gif" media="(prefers-reduced-motion: no-preference)"> -->
        <img src="assets/photo.jpg" alt="유준형 프로필 사진" width="800" height="1000" decoding="async" onerror="this.closest('.media').classList.add('is-empty')">
      </picture>
      <!-- <video src="assets/intro.mp4" poster="assets/photo.jpg" autoplay muted loop playsinline aria-label="유준형 소개 영상"></video> -->
      <div class="media-empty" aria-hidden="true"><b>JR</b><span>프로필 사진 준비 중</span></div>
    </div>
    <figcaption><span>유준형</span><span>2026</span></figcaption>
  </figure>

  <div class="intro-col">
    <div class="head">
      <p class="role">클라우드 인프라 · DevOps 엔지니어</p>
      <h1>유준형</h1>
      <p class="en">Jason Ryu</p>
    </div>
    <div class="rest">
      <p class="intro">통신 장비 검증과 기술지원을 <strong>9년</strong> 해왔습니다. 그 운영 경험을 바탕으로 지금은 <strong>Terraform·Kubernetes</strong> 인프라를 직접 설계하고 운영합니다.</p>

      <nav aria-label="주요 메뉴">
        <a href="profile/"><b>Profile</b><small>경력, 학력, 자격, 기술 스택</small><svg class="arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M6 14 14 6M7 6h7v7"/></svg></a>
        <a href="portfolio/" class="primary"><b>Portfolio</b><small>프로젝트별 설계와 발표 자료</small><svg class="arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M6 14 14 6M7 6h7v7"/></svg></a>
        <a href="/game/"><b>Playground<span class="badge">운영 중</span></b><small>GKE에서 직접 운영하는 웹게임 「시간 낭비의 숲」</small><svg class="arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M6 14 14 6M7 6h7v7"/></svg></a>
        <a href="contact/"><b>Contact</b><small>이메일, GitHub</small><svg class="arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M6 14 14 6M7 6h7v7"/></svg></a>
      </nav>
    </div>
  </div>

  <footer><span>© 2026 유준형</span><span>1bit.kr</span></footer>
</div>
<script>
  // 영상: 모션 줄이기 사용자에겐 멈춘 첫 프레임만. 이미지가 이미 깨진 채 캐시된 경우도 자리표시로
  const media = document.getElementById('media');
  const video = media.querySelector('video');
  if (video && matchMedia('(prefers-reduced-motion: reduce)').matches) { video.removeAttribute('autoplay'); video.pause(); }
  if (video) video.addEventListener('error', () => media.classList.add('is-empty'));
  const img = media.querySelector('img');
  if (!video && img && img.complete && !img.naturalWidth) media.classList.add('is-empty');
</script>
</body>
</html>
