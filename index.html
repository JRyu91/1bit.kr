<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>유준형 · 클라우드 인프라 엔지니어</title>
<meta name="description" content="클라우드 인프라·DevOps 엔지니어 유준형의 포트폴리오">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Botanical Cream. sage 는 대비 2.3:1 이라 글자에 쓰지 않고 선·장식에만 쓴다 */
:root{
  --cream:#FFF9ED; --green:#355E3B; --sage:#A2AD84; --beige:#D9C7A3; --ink:#26382B; --surface:#FFFFFF;
  --muted:#5B6A5E; /* 보조 텍스트, cream 위 5.5:1 */
  --line:color-mix(in srgb,var(--beige) 70%,var(--cream));
  --space-1:8px; --space-2:16px; --space-3:24px; --space-4:32px; --space-6:48px; --space-8:64px;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

.wrap{max-width:1040px;min-height:100dvh;margin:0 auto;padding:var(--space-8) var(--space-4) var(--space-6);display:grid;grid-template-columns:320px 1fr;grid-template-rows:1fr auto;column-gap:var(--space-8);align-items:center}

.photo{aspect-ratio:4/5;border-radius:4px;background:color-mix(in srgb,var(--beige) 45%,var(--cream));position:relative;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:15px}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.role{margin:0;font-size:15px;font-weight:500;color:var(--green)}
h1{margin:var(--space-1) 0 0;font-size:40px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
h1 span{margin-left:var(--space-1);font-size:20px;font-weight:500;color:var(--muted);letter-spacing:0}
.intro{max-width:34em;margin:var(--space-3) 0 0;color:var(--muted)}
.intro strong{color:var(--ink);font-weight:600}

nav{margin-top:var(--space-6);border-top:2px solid var(--green)}
nav a{display:grid;grid-template-columns:1fr auto;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-2);border-bottom:1px solid var(--line);text-decoration:none;transition:background-color .2s ease}
nav a:hover{background:var(--surface)}
nav a:active{background:color-mix(in srgb,var(--sage) 18%,var(--surface))}
nav b{display:block;font-size:20px;font-weight:600;line-height:1.3}
nav small{display:block;margin-top:2px;font-size:14px;color:var(--muted)}
nav i{font-style:normal;font-size:18px;color:var(--green);transition:transform .2s ease}
nav a:hover i{transform:translateX(3px)}

footer{grid-column:1/-1;margin-top:var(--space-6);padding-top:var(--space-2);border-top:1px solid var(--line);font-size:13px;color:var(--muted)}

@media (max-width:760px){
  .wrap{grid-template-columns:1fr;padding:var(--space-4) var(--space-2) var(--space-3);row-gap:0;align-items:start}
  .photo{width:112px;aspect-ratio:1;border-radius:4px;margin-bottom:var(--space-3);font-size:13px}
  h1{font-size:32px}
  h1 span{display:block;margin:2px 0 0;font-size:17px}
  nav{margin-top:var(--space-4)}
  nav a{padding:var(--space-2) var(--space-1)}
}
@media (prefers-reduced-motion:reduce){nav a,nav i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="photo">사진<img src="assets/photo.jpg" alt="유준형 프로필 사진" onerror="this.remove()"></div>

  <main>
    <p class="role">클라우드 인프라 · DevOps 엔지니어</p>
    <h1>유준형<span>Jason Ryu</span></h1>
    <p class="intro">통신 장비 검증과 기술지원을 <strong>9년</strong> 해왔습니다. 지금은 그 운영 경험을 바탕으로 Terraform·Kubernetes 인프라를 직접 설계하고 운영합니다.</p>

    <nav aria-label="메뉴">
      <a href="profile/"><span><b>Profile</b><small>경력, 학력, 자격, 기술 스택</small></span><i aria-hidden="true">→</i></a>
      <a href="portfolio/"><span><b>Portfolio</b><small>프로젝트별 설계와 발표 자료</small></span><i aria-hidden="true">→</i></a>
      <a href="/game/"><span><b>Playground</b><small>GKE에서 직접 운영 중인 웹게임 「시간 낭비의 숲」</small></span><i aria-hidden="true">→</i></a>
      <a href="contact/"><span><b>Contact</b><small>이메일, GitHub</small></span><i aria-hidden="true">→</i></a>
    </nav>
  </main>

  <footer>© 2026 유준형</footer>
</div>
</body>
</html>
