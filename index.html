<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>유준형 · Cloud Infrastructure Engineer</title>
<meta name="description" content="클라우드 인프라 엔지니어 유준형의 포트폴리오">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Pantone 2026 Cloud Dancer + Powdered Pastels (hex 는 근사값) */
:root{
  --cloud-dancer:#F0EEE9; --nimbus:#D5D5D8; --lemon:#F4EBC6; --rose:#EAD6DC;
  --ice:#D3E2EF; --peach:#F0D7CB; --aqua:#CDD8C6; --orchid:#DCD6E1;
  --ink:#2F2F33; --ink-sub:#5E5E66; --card:#FBFAF7;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --latin:'Space Grotesk',var(--sans);
}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:40px 16px;background:var(--cloud-dancer);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:400px;padding:44px 28px 32px;border-radius:28px;background:var(--card);border:1px solid var(--nimbus);box-shadow:0 24px 48px -28px rgba(47,47,51,.25);text-align:center}
.photo{width:128px;height:128px;margin:0 auto 22px;border-radius:50%;padding:4px;background:conic-gradient(var(--ice),var(--orchid),var(--rose),var(--peach),var(--lemon),var(--aqua),var(--ice))}
.photo div{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;border:3px solid var(--card);background:var(--cloud-dancer);display:grid;place-items:center;font:700 34px var(--latin);color:var(--ink-sub)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
.en{margin-top:2px;font:500 14px var(--latin);letter-spacing:.08em;color:var(--ink-sub)}
.role{display:inline-block;margin-top:14px;padding:6px 14px;border-radius:999px;background:var(--ice);font-size:14px;font-weight:600}
.lead{margin:16px auto 0;max-width:300px;font-size:15px;color:var(--ink-sub)}
nav{display:grid;gap:12px;margin-top:30px}
nav a{display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 18px;border-radius:18px;text-decoration:none;text-align:left;border:1px solid transparent;transition:transform .2s,border-color .2s}
nav a:hover{transform:translateY(-2px);border-color:var(--ink-sub)}
nav a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
nav a:nth-child(1){background:var(--rose)}
nav a:nth-child(2){background:var(--aqua)}
nav a:nth-child(3){background:var(--lemon)}
nav a:nth-child(4){background:var(--orchid)}
nav svg{flex:none;width:22px;height:22px}
nav b{display:block;font:700 17px var(--latin)}
nav small{display:block;font-size:13px;color:var(--ink-sub)}
nav .go{margin-left:auto;font:500 18px var(--latin);color:var(--ink-sub)}
footer{margin-top:28px;font-size:13px;color:var(--ink-sub)}
@media (prefers-reduced-motion:reduce){nav a{transition:none}}
</style>
</head>
<body>
<main class="card">
  <div class="photo"><div>JR<img src="assets/photo.jpg" alt="유준형 프로필 사진" onerror="this.remove()"></div></div>
  <h1>유준형</h1>
  <div class="en">JASON RYU</div>
  <div class="role">Cloud Infrastructure Engineer</div>
  <p class="lead">안정적인 클라우드 인프라를 설계하고 운영합니다.</p>

  <nav aria-label="메뉴">
    <a href="profile/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span><b>Profile</b><small>이력 · 경력 · 기술</small></span><span class="go" aria-hidden="true">→</span>
    </a>
    <a href="portfolio/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      <span><b>Portfolio</b><small>프로젝트 발표 자료</small></span><span class="go" aria-hidden="true">→</span>
    </a>
    <a href="/game/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      <span><b>Playground</b><small>직접 운영하는 웹게임 · 시간 낭비의 숲</small></span><span class="go" aria-hidden="true">→</span>
    </a>
    <a href="contact/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      <span><b>Contact</b><small>이메일 · GitHub</small></span><span class="go" aria-hidden="true">→</span>
    </a>
  </nav>

  <footer>© 2026 Jason Ryu</footer>
</main>
</body>
</html>
