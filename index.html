<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jason Ryu · Cloud Infrastructure Engineer</title>
<meta name="description" content="클라우드 인프라 엔지니어 유준형의 포트폴리오">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 바탕은 Pantone 2026 Cloud Dancer, 포인트는 Ice Melt 하나만 (hex 근사값) */
:root{
  --bg:#F0EEE9; --ink:#1E1D1B; --sub:#6B6862; --line:#D8D4CB; --point:#D3E2EF;
  --display:'Playfair Display',Georgia,serif;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.page{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);min-height:100dvh}

.photo{position:relative;margin:24px 0 24px 24px;border-radius:4px;overflow:hidden;background:var(--point);display:grid;place-items:center}
.photo span{font:italic 400 clamp(5rem,12vw,10rem)/1 var(--display);color:rgba(30,29,27,.18)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.content{display:flex;flex-direction:column;padding:56px clamp(24px,6vw,96px) 40px}
.label{font:500 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--sub)}
h1{margin:auto 0 0;padding-top:48px;font:500 clamp(3.25rem,7vw,6.5rem)/.95 var(--display);letter-spacing:-.03em}
h1 em{font-style:italic;font-weight:400}
.who{margin:20px 0 0;font-size:17px;color:var(--sub)}
.who b{color:var(--ink);font-weight:600}

nav{margin:56px 0 auto;border-top:1px solid var(--ink)}
nav a{display:grid;grid-template-columns:44px 1fr auto 24px;align-items:baseline;gap:12px;padding:20px 12px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;transition:background-color .25s ease}
nav a:hover,nav a:focus-visible{background:var(--point)}
nav a:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.no{font:400 13px var(--mono);color:var(--sub)}
.name{font:500 clamp(1.6rem,2.6vw,2.1rem)/1.1 var(--display)}
.desc{font-size:14px;color:var(--sub);text-align:right}
.arrow{font:400 18px var(--mono);transition:transform .25s ease}
nav a:hover .arrow{transform:translateX(4px)}

footer{display:flex;justify-content:space-between;margin-top:40px;font:400 12px var(--mono);letter-spacing:.08em;color:var(--sub)}

@media (max-width:820px){
  .page{grid-template-columns:1fr}
  .photo{height:44vh;margin:16px 16px 0}
  .content{padding:36px 20px 28px}
  h1{padding-top:0;margin-top:28px}
  nav{margin:40px 0 0}
  nav a{grid-template-columns:36px 1fr 20px;padding:18px 4px}
  .desc{grid-column:2;grid-row:2;text-align:left;margin-top:-6px}
  .arrow{grid-column:3;grid-row:1}
}
@media (prefers-reduced-motion:reduce){nav a,.arrow{transition:none}}
</style>
</head>
<body>
<div class="page">
  <div class="photo"><span aria-hidden="true">JR</span><img src="assets/photo.jpg" alt="유준형 프로필 사진" onerror="this.remove()"></div>

  <main class="content">
    <div class="label">Portfolio — 2026</div>
    <h1>Jason <em>Ryu</em></h1>
    <p class="who"><b>유준형</b> · 클라우드 인프라 엔지니어</p>

    <nav aria-label="메뉴">
      <a href="profile/"><span class="no">01</span><span class="name">Profile</span><span class="desc">이력 · 경력 · 기술</span><span class="arrow" aria-hidden="true">→</span></a>
      <a href="portfolio/"><span class="no">02</span><span class="name">Portfolio</span><span class="desc">프로젝트 발표 자료</span><span class="arrow" aria-hidden="true">→</span></a>
      <a href="/game/"><span class="no">03</span><span class="name">Playground</span><span class="desc">직접 운영하는 웹게임</span><span class="arrow" aria-hidden="true">→</span></a>
      <a href="contact/"><span class="no">04</span><span class="name">Contact</span><span class="desc">이메일 · GitHub</span><span class="arrow" aria-hidden="true">→</span></a>
    </nav>

    <footer><span>CLOUD · INFRA · DEVOPS</span><span>© 2026</span></footer>
  </main>
</div>
</body>
</html>
